worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_body_timeout 10s;
    send_timeout 60s;

    map "$request_method:$uri" $fixture_write {
        default "";
        ~^POST:/api/v2/demo(?:/[^/]+/repair)?$ demo;
    }

    limit_req_zone $fixture_write zone=fixture_write:1m rate=6r/m;

    server {
        listen 127.0.0.1:18201;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The origin must not trust forwarding information supplied by visitors.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";

        location ~ ^/(health$|api/v2(?:/|$)) {
            limit_req zone=fixture_write burst=2 nodelay;
            limit_req_status 429;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_pass http://127.0.0.1:8200;
        }

        location /api/ {
            return 404;
        }

        location / {
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Authorization "";
            proxy_pass http://127.0.0.1:13200;
        }
    }
}
